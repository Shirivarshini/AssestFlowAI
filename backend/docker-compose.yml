# SOURCE: 03_ARCHITECTURE.md — "Docker Compose for local development",
# PostgreSQL as the database. Implementation choice: service names/ports.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: assetflow
      POSTGRES_DB: assetflow
    ports:
      - "5432:5432"
    volumes:
      - assetflow_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://assetflow:assetflow@db:5432/assetflow
      API_PREFIX: /api/v1
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  assetflow_pgdata:
